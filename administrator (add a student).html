<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление ученика</title>
    <link rel="stylesheet" href="add student.css">
</head>
<body>  
    <!-- Ссылка для возврата на предыдущую страницу -->
    <a href="administrator (select role).html" class="back-arrow" onclick="goBack()">&#8592;</a>
    <!-- Контейнер для формы добавления ученика -->
    <div class="container">
        <h1>Добавление ученика</h1>
        <!-- Форма для ввода данных ученика -->
        <form id="addUserForm">
            <!-- Поля для ввода фамилии, имени и отчества -->
            <input type="text" id="lastName" class="input-field" name="lastName" placeholder="Фамилия" required />
            <input type="text" id="firstName" class="input-field" name="firstName" placeholder="Имя" required />
            <input type="text" id="middleName" class="input-field" name="middleName" placeholder="Отчество" required />
            <div class="select-wraapper">
                <!-- Выбор класса (число) -->
                <select id="classNumber" class="select-field" required>
                    <option value="" disabled selected>класс (число)</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                </select>

                <!-- Выбор класса (буква) -->
                <select id="classLetter" class="select-field" required>
                    <option value="" disabled selected>класс (буква)</option>
                    <option value="А">А</option>
                    <option value="Б">Б</option>
                    <option value="В">В</option>
                    <option value="Г">Г</option>
                    <option value="Д">Д</option>
                    <option value="Е">Е</option>
                    <option value="М">М</option>
                    <option value="К">К</option>
                    <option value="Ы">Ы</option>
                </select>
            </div>

          
            <!-- Поля для ввода логина и пароля -->
            <input type="text" id="@telegram" class="input-field" name="@telegram" placeholder="@telegram" required />
            <input type="date"value="0000-00-00" min="2006-01-01" max="2019-01-01"  id="date_of_birth" class="input-field" name="date_of_birth" placeholder="00.00.0000(дата рождения)" required />
            <input type="text" id="login" class="input-field" name="login" placeholder="Логин" required />
            <input type="password" id="password" class="input-field" name="password" placeholder="Пароль" required />

            <!-- Кнопка для добавления пользователя -->
            <button type="button" id="createBtn" class="button">Добавить</button>
        </form>
    </div>

    <script>
        // Функция для возврата на предыдущую страницу
        function goBack() {
            window.history.back();
        }
        
        // Получаем все поля ввода и селекты, а также кнопку "Добавить"
        const inputs = document.querySelectorAll('.input-field, .select-field');
        const createBtn = document.getElementById('createBtn');

        // Добавляем обработчик событий для каждого поля ввода и выбора
        inputs.forEach(input => {
            input.addEventListener('input', () => {
                // Проверяем, что все поля заполнены
                const allFilled = Array.from(inputs).every(input => input.value.trim() !== '');
                createBtn.disabled = !allFilled; // Отключаем кнопку, если хотя бы одно поле пустое

                // Если все поля заполнены, добавляем активный класс к кнопке
                if (allFilled) {
                    createBtn.classList.add('active');
                } else {
                    createBtn.classList.remove('active');
                }
            });
        });

        // Обработчик клика по кнопке "Добавить"
        createBtn.addEventListener('click', () => {
            // Считываем значения всех полей формы
            const lastName = document.getElementById('lastName').value;
            const firstName = document.getElementById('firstName').value;
            const middleName = document.getElementById('middleName').value;
            const login = document.getElementById('login').value;
            const password = document.getElementById('password').value;
            const classNumber = document.getElementById('classNumber').value;
            const classLetter = document.getElementById('classLetter').value;

            // Получаем список пользователей из localStorage, если он есть
            let  apprentice = JSON.parse(localStorage.getItem('apprentice')) || [];

            // Добавляем нового пользователя в список
            apprentice.push({ lastName, firstName, middleName, login, password, classNumber, classLetter });

            // Сохраняем обновленный список в localStorage
            localStorage.setItem('apprentice', JSON.stringify(apprentice));

            // Переходим на страницу списка
            window.location.href = 'student page.html';
        });
    </script>
</body>
</html>
