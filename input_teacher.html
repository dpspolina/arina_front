<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <style>
        /* Обнуление стандартных отступов и границ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Стили для тела страницы */
        body {
            font-family: Arial, sans-serif; /* Шрифт */
            background-image: url(img/Vector1.svg); /* Фоновое изображение */
            display: flex; /* Гибкое позиционирование */
            justify-content: center; /* Центрирование по горизонтали */
            align-items: center; /* Центрирование по вертикали */
            height: 100vh; /* Высота страницы */
            background-color: #F4EFFF; /* Цвет фона */
            background-repeat: no-repeat; /* Запрет на повтор фона */
            background-size: cover; /* Растяжение фона на весь экран */
            background-position: center; /* Центрирование фона */
        }

        /* Контейнер для формы входа */
        .container {
            text-align: center;
            width: 100%;
            max-width: 400px; /* Ограничение ширины */
            background: rgba(255, 255, 255, 0.9); /* Полупрозрачный фон */
            border-radius: 10px; /* Скругление углов */
            padding: 20px; /* Внутренний отступ */
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1); /* Тень */
        }

        /* Заголовок */
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #111; /* Цвет текста */
        }

        /* Поля ввода */
        .input-field {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 16px;
            border: 1.5px solid #ddd; /* Граница */
            border-radius: 8px; /* Скругление углов */
            background-color: #fff; /* Цвет фона */
        }

        /* Кнопка входа */
        .button {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            text-align: center;
            background-color: #a29bb8; /* Цвет кнопки */
            color: white; /* Цвет текста */
            text-decoration: none;
            border-radius: 8px;
            cursor: not-allowed; /* Запрещённый курсор (кнопка неактивна) */
            border: none;
            transition: background-color 0.2s ease; /* Анимация цвета */
        }

        /* Активное состояние кнопки */
        .button.active {
            background-color: #65558F;
            cursor: pointer;
        }
        .button.active:hover {
            background-color: #65558F;
        }

        /* Сообщение об ошибке */
        .error-message {
            color: red;
            font-size: 14px;
            margin-bottom: 10px;
            display: none; /* Скрыто по умолчанию */
            text-align: left;
        }

        /* Кнопка "Назад" */
        .back-arrow {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            color: #8e8eb9;
            text-decoration: none;
            font-weight: bold;
        }
        .back-arrow:hover {
            color: #6e6e8f;
        }
    </style>
</head>
<body>
    <!-- Стрелка для возврата назад -->
    <a href="javascript:history.back()" class="back-arrow">&#8592;</a>
    <a href="role selection.html" class="back-arrow">&#8592;</a>
    
    <div class="container">
        <h1>Вход</h1>
        <form id="loginForm">
            <!-- Поле для ввода логина -->
            <input type="text" id="login" class="input-field" placeholder="Логин" required>
            <!-- Поле для ввода пароля -->
            <input type="password" id="password" class="input-field" placeholder="Пароль" required>
            <!-- Сообщение об ошибке -->
            <p id="errorMessage" class="error-message">Неправильно введены данные</p>
            <!-- Кнопка входа -->
            <button type="submit" class="button" id="submitButton" disabled>Войти</button>
        </form>
    </div>
    
    <script>
        const loginInput = document.getElementById('login');
        const passwordInput = document.getElementById('password');
        const submitButton = document.getElementById('submitButton');
        const errorMessage = document.getElementById('errorMessage');

        // Заранее заданные правильные данные для входа
        const validCredentials = {
            login: "логин", // Укажите правильный логин
            password: "пароль" // Укажите правильный пароль
        };

        // Функция проверки заполненности полей
        function updateButtonState() {
            if (loginInput.value.trim() && passwordInput.value.trim()) {
                submitButton.disabled = false;
                submitButton.classList.add('active');
            } else {
                submitButton.disabled = true;
                submitButton.classList.remove('active');
            }
            errorMessage.style.display = 'none'; // Скрываем ошибку при изменении данных
        }

        // Обработчик отправки формы
        document.getElementById('loginForm').addEventListener('submit', (event) => {
            event.preventDefault(); // Отмена стандартного поведения формы
            
            const login = loginInput.value.trim();
            const password = passwordInput.value.trim();

            // Проверка введённых данных
            if (login === validCredentials.login && password === validCredentials.password) {
                window.location.href = 'student-portfolio.html'; // Перенаправление на другую страницу
            } else {
                errorMessage.style.display = 'block'; // Показываем сообщение об ошибке
                submitButton.disabled = true;
                submitButton.classList.remove('active');
            }
        });

        // Обработчики ввода данных для активации кнопки
        loginInput.addEventListener('input', updateButtonState);
        passwordInput.addEventListener('input', updateButtonState);
    </script>
</body>
</html>
